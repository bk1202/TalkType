name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/LockIn.Desktop/LockIn.Desktop.csproj --configuration Release
      - name: Publish self-contained app
        run: dotnet publish src/LockIn.Desktop/LockIn.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/TalkType-Windows-x64
      - uses: actions/upload-artifact@v6
        with:
          name: TalkType-Windows-x64
          path: artifacts/TalkType-Windows-x64
