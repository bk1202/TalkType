name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained app
        run: dotnet publish src/TalkType.Desktop/TalkType.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/TalkType-Windows-x64
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles}", "${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object FullName -Match 'Inno Setup' |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $compiler) { throw 'Inno Setup compiler was not found.' }
          & $compiler installer\TalkType.iss
      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/TalkType-Windows-x64/* -DestinationPath artifacts/TalkType-Windows-x64.zip
          Get-FileHash artifacts/installer/*.exe, artifacts/TalkType-Windows-x64.zip -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } |
            Set-Content artifacts/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/installer/*.exe
            artifacts/TalkType-Windows-x64.zip
            artifacts/SHA256SUMS.txt
